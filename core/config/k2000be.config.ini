; Valeurs par défaut de la configuration du plugin.
; La section porte l'identifiant du plugin : nommée [default], elle serait inerte.
[k2000be]
apikey = ""
base_url = "https://api.openai.com/v1"
; gpt-5.4-mini, parce que c'est le plus récent des « mini » qui fasse des
; outils sur Chat Completions sans réglage de plus : il ne raisonne pas par
; défaut (reasoning_effort « none »), accepte donc la température, et ne mange
; pas le plafond de jetons en réflexion cachée. gpt-4o-mini, livré jusque-là,
; date de 2024 et se trompait plus souvent d'équipement. gpt-6-luna coûte moins
; cher encore, mais sur Chat Completions il n'appelle d'outils qu'avec
; reasoning_effort à « none », que le plugin n'envoie pas : il échouerait à la
; première demande. Ce défaut ne vaut que tant que le champ Modèle est vide.
model = "gpt-5.4-mini"
timeout = 60
max_tokens = 1200
; Outils exécutés au plus pour une seule demande. Quinze, parce que la demande
; emblématique les dépense : « je vais me coucher » sur une maison d'une
; soixantaine d'équipements situe la maison (1), liste deux ou trois pièces
; (3), détaille quelques équipements (2), éteint une demi-douzaine de choses
; (6) puis vérifie ce qui est parti (1 à 3) — douze à dix-huit outils. À dix,
; la boucle coupait au milieu de l'extinction et l'assistant concluait sur une
; maison à moitié éteinte. Le plafond haut, lui, reste à 30 (MAX_OUTILS_MAX).
max_tool_calls = 15
; Demandes facturées qu'une journée a le droit de porter, tous assistants
; confondus. 0 : pas de plafond, et c'est ce qui est livré — le plugin n'a pas
; à décider combien de fois on parle à sa maison. Ce garde-fou existe pour le
; scénario qui s'emballe, pas pour l'usage humain. Plafond haut : 2000
; (DEMANDES_JOUR_MAX).
max_demandes_jour = 0
temperature = 0.3
securite = "simulation"
lecture_defaut = 1
memoire_tours = 12
historique_jours = 30
contexte_maison = 1
persona = "kitt"
prompt_extra = ""
; La fiche de la maison : ce que le plugin ne peut pas déduire des équipements
; — qui habite là, comment on chauffe, à quelle heure on se couche. Elle repart
; chez OpenAI à chaque demande : seuls les champs remplis produisent une ligne,
; et tous sont livrés vides. On n'y écrit que ce qui change une décision, jamais
; une adresse, un prénom ou un âge nominatif.
maison_foyer = ""
maison_animaux = ""
maison_logement = ""
maison_chauffage = ""
maison_habitudes = ""
maison_interdits = ""
maison_vehicule = ""
